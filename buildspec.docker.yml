# CodeBuild (privileged): build image → ECR → imagedefinitions.json for a future ECS deploy action.
# Env vars: AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, IMAGE_REPO_NAME, ECS_CONTAINER_NAME (set on the CodeBuild project).
version: "0.2"

phases:
  pre_build:
    commands:
      - set -eux
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - |
        set -eux
        export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
        export IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
        echo "IMAGE_URI=$IMAGE_URI"
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        docker build -t "$IMAGE_URI" .

  post_build:
    commands:
      - |
        set -eux
        export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
        export IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
        docker push "$IMAGE_URI"
        printf '[{"name":"%s","imageUri":"%s"}]' "$ECS_CONTAINER_NAME" "$IMAGE_URI" > "$CODEBUILD_SRC_DIR/imagedefinitions.json"
        cat "$CODEBUILD_SRC_DIR/imagedefinitions.json"

artifacts:
  files:
    - imagedefinitions.json
