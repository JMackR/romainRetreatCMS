# AWS CodeBuild - Yarn + Next.js (see docs/aws-codepipeline-github.md).
#
# Project source/artifacts type CODEPIPELINE: keep `artifacts:` below. For NO_ARTIFACTS + NO_SOURCE only, remove it.
#
version: "0.2"

env:
  variables:
    NODE_ENV: development

phases:
  install:
    runtime-versions:
      nodejs: "20"
    commands:
      - |
        set -euxo pipefail
        echo "CODEBUILD_SRC_DIR=$CODEBUILD_SRC_DIR"
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        pwd
        node -v
        if ! command -v yarn >/dev/null 2>&1; then
          npm install -g yarn@1.22.22
        fi
        yarn --version
        rm -rf node_modules .next
        yarn install --frozen-lockfile --network-timeout 300000
        if [ "$(uname -s)" = "Linux" ]; then
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ] && [ ! -d node_modules/@tailwindcss/oxide-linux-x64-gnu ]; then
            npm install @tailwindcss/oxide-linux-x64-gnu@4.2.4 --no-save --include=optional \
              || npm install @tailwindcss/oxide-linux-x64-gnu@4.2.4 --no-save
          fi
          if [ "$ARCH" = "aarch64" ] && [ ! -d node_modules/@tailwindcss/oxide-linux-arm64-gnu ]; then
            npm install @tailwindcss/oxide-linux-arm64-gnu@4.2.4 --no-save --include=optional \
              || npm install @tailwindcss/oxide-linux-arm64-gnu@4.2.4 --no-save
          fi
        fi

  build:
    commands:
      - |
        set -euxo pipefail
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        echo "Running yarn build"
        yarn build

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - node_modules/**/*
    - romainRetreatCMS/node_modules/**/*
