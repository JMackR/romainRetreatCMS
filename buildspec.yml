# AWS CodeBuild — THIS REPO USES YARN (yarn.lock), NOT npm.
#
# If logs still show `npm run build`, CodeBuild is ignoring this file. Fix:
#   CodeBuild → Edit → Buildspec → use BUILD SPEC FILE → path `buildspec.yml`
#   (same path as package.json in the cloned repo).
#
# Tailwind v4 needs @tailwindcss/oxide-* native addons on Linux; install fallback below.

version: 0.2

env:
  variables:
    # npm ci / production-style installs can omit optional deps; yarn + oxide fallback needs dev graph
    NODE_ENV: development

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - |
        set -euxo pipefail
        echo "CODEBUILD_SRC_DIR=$CODEBUILD_SRC_DIR"
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        pwd
        node -v
        # Starter templates often only have npm — install Yarn 1.x explicitly (matches yarn.lock).
        if ! command -v yarn >/dev/null 2>&1; then
          npm install -g yarn@1.22.22
        fi
        yarn --version
        rm -rf node_modules .next
        yarn install --frozen-lockfile --network-timeout 300000
        # Belt-and-suspenders for Tailwind Oxide on Amazon Linux (x86_64 / aarch64).
        if [ "$(uname -s)" = "Linux" ]; then
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ] && [ ! -d node_modules/@tailwindcss/oxide-linux-x64-gnu ]; then
            npm install @tailwindcss/oxide-linux-x64-gnu@4.2.4 --no-save --include=optional \
              || npm install @tailwindcss/oxide-linux-x64-gnu@4.2.4 --no-save
          fi
          if [ "$ARCH" = "aarch64" ] && [ ! -d node_modules/@tailwindcss/oxide-linux-arm64-gnu ]; then
            npm install @tailwindcss/oxide-linux-arm64-gnu@4.2.4 --no-save --include=optional \
              || npm install @tailwindcss/oxide-linux-arm64-gnu@4.2.4 --no-save
          fi
        fi

  build:
    commands:
      - |
        set -euxo pipefail
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        echo "Running yarn build (not npm)"
        yarn build

  post_build:
    commands:
      - echo "build finished $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$CODEBUILD_SRC_DIR/codebuild-build-marker.txt"

cache:
  paths:
    - node_modules/**/*
    - romainRetreatCMS/node_modules/**/*

artifacts:
  files:
    - codebuild-build-marker.txt
  discard-paths: yes
