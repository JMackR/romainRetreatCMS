# AWS CodeBuild — used by CodePipeline (GitHub source via CodeStar Connections).
#
# Repo layouts:
#   • CMS-only repo: package.json at repo root — build runs here.
#   • Monorepo: romainRetreatCMS/ subfolder — script cds into it when present.
#
# Tailwind CSS v4 (@tailwindcss/postcss → @tailwindcss/oxide) needs a **native**
# binding on Linux CI (@tailwindcss/oxide-linux-x64-gnu). npm occasionally skips
# optional deps (npm/cli#4828); we install explicitly if missing. Prefer **yarn**
# for this repo (yarn.lock). If your pipeline uses `npm ci`, run:
#   npm ci --include=optional
#
# Build-time env: set in CodeBuild → Environment variables (see docs/aws-codepipeline-github.md).

version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - |
        set -e
        echo "CODEBUILD_SRC_DIR=$CODEBUILD_SRC_DIR"
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        pwd
        node -v
        corepack enable || true
        yarn install --frozen-lockfile
        # Ensure Tailwind Oxide native module on Linux CodeBuild (fixes next/font + postcss)
        if [ "$(uname -s)" = "Linux" ]; then
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ] && [ ! -d node_modules/@tailwindcss/oxide-linux-x64-gnu ]; then
            echo "Installing @tailwindcss/oxide-linux-x64-gnu for Tailwind v4"
            npm install @tailwindcss/oxide-linux-x64-gnu@4.2.4 --no-save --include=optional \
              || npm install @tailwindcss/oxide-linux-x64-gnu@4.2.4 --no-save
          fi
          if [ "$ARCH" = "aarch64" ] && [ ! -d node_modules/@tailwindcss/oxide-linux-arm64-gnu ]; then
            echo "Installing @tailwindcss/oxide-linux-arm64-gnu for Tailwind v4"
            npm install @tailwindcss/oxide-linux-arm64-gnu@4.2.4 --no-save --include=optional \
              || npm install @tailwindcss/oxide-linux-arm64-gnu@4.2.4 --no-save
          fi
        fi

  build:
    commands:
      - |
        set -e
        cd "$CODEBUILD_SRC_DIR"
        if [ -d romainRetreatCMS ]; then
          cd romainRetreatCMS
        fi
        yarn build

  post_build:
    commands:
      - echo "build finished $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$CODEBUILD_SRC_DIR/codebuild-build-marker.txt"

cache:
  paths:
    - node_modules/**/*
    - romainRetreatCMS/node_modules/**/*

artifacts:
  files:
    - codebuild-build-marker.txt
  discard-paths: yes
